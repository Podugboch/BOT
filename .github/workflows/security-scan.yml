name: Security & Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-scan:
    name: Security & Secret Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich

      - name: Run Secret, Password & Blacklist Scan
        run: |
          python scripts/security_check.py --all

      - name: Run Sec-Code-Ref-Linter Engine
        run: |
          python scripts/linter.py --target . --exclude-tests --strict
