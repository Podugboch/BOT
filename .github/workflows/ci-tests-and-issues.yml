name: "CI Tests & Auto-Issue on Failure"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    name: "Run Test Suite"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Pytest
        id: run_tests
        run: |
          pytest -v

      - name: Auto-Create GitHub Issue on Test Failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 CI Test Failure on ${context.ref.replace('refs/heads/', '')} (${context.sha.substring(0, 7)})`;
            const body = `### Automated Test Failure Report\n\n` +
              `Tests failed during automated CI run for commit [${context.sha.substring(0, 7)}](${context.payload.repository.html_url}/commit/${context.sha}) by @${context.actor}.\n\n` +
              `**Commit Message:**\n\`\`\`\n${context.payload.head_commit ? context.payload.head_commit.message : 'Manual run'}\n\`\`\`\n\n` +
              `**Workflow Run:** [View Full Logs & Details](${context.payload.repository.html_url}/actions/runs/${context.runId})\n\n` +
              `Please review the test output in GitHub Actions and push a fix.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'ci-failure', 'automated-issue']
            });
