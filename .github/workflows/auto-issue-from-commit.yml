name: "Auto-Create Issue from Commit or Dispatch"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      title:
        description: "Issue Title"
        required: true
        type: string
      body:
        description: "Issue Description"
        required: false
        type: string
        default: ""
      labels:
        description: "Comma-separated labels (e.g. enhancement, task)"
        required: false
        type: string
        default: "task"

permissions:
  contents: read
  issues: write

jobs:
  create-issue:
    name: "Generate Issue"
    runs-on: ubuntu-latest
    steps:
      - name: Parse Commit Message or Dispatch Inputs
        uses: actions/github-script@v7
        with:
          script: |
            let issueTitle = "";
            let issueBody = "";
            let issueLabels = ["automated-issue"];

            if (context.eventName === 'workflow_dispatch') {
              issueTitle = context.payload.inputs.title;
              issueBody = context.payload.inputs.body || "Created via manual workflow dispatch.";
              const extraLabels = (context.payload.inputs.labels || "")
                .split(",")
                .map(s => s.trim())
                .filter(Boolean);
              issueLabels.push(...extraLabels);
            } else if (context.eventName === 'push' && context.payload.head_commit) {
              const msg = context.payload.head_commit.message;
              const match = msg.match(/\[(?:issue|task):\s*(.*?)\]/i) || msg.match(/^(?:issue|task):\s*(.*?)$/im);
              if (match && match[1]) {
                issueTitle = match[1].trim();
                issueBody = `### Task Auto-Generated from Commit\n\n` +
                  `**Triggered by commit:** [${context.sha.substring(0, 7)}](${context.payload.repository.html_url}/commit/${context.sha}) by @${context.actor}\n\n` +
                  `**Full Commit Message:**\n\`\`\`\n${msg}\n\`\`\``;
                issueLabels.push("task");
              }
            }

            if (issueTitle) {
              console.log(`Creating issue: ${issueTitle}`);
              const issue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: issueLabels
              });
              console.log(`Successfully created issue #${issue.data.number}: ${issue.data.html_url}`);
            } else {
              console.log("No [issue: ...] tag detected in commit message. Skipping issue creation.");
            }
