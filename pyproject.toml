[project]
name = "bot"
version = "2.0.0"
description = "Trader Queen: Autonomous Trading Platform with Strategy, Risk Manager, Web Dashboard, and Exchange Authentication"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.3.3",
    "numpy>=1.24.0",
    "ccxt>=4.5.92",
    "dnspython>=2.8.0",
    "cryptography>=50.0.2"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["."]
addopts = "-v"
